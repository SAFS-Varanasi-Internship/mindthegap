bundle_version: '1.0'
model:
  name: GlobColour U-Net gap filler
  version: '1.0'
  framework: keras
dataset:
  name: GlobColour
  product_id: cmems_obs-oc_glo_bgc-plankton_my_l3-multi-4km_P1D
  region:
    lat:
    - 25.687498092651367
    - 30.979164123535156
    lon:
    - 42.02083969116211
    - 47.31250762939453
  training_period: 1997-09-04 to 1997-11-03
inputs:
- name: masked_target
  channel: 0
- name: masked_target_m1
  channel: 1
- name: masked_target_p1
  channel: 2
- name: day_sin
  channel: 3
- name: day_cos
  channel: 4
- name: synthetic_missing_flag
  channel: 5
- name: true_missing_flag
  channel: 6
- name: valid_masked_target_flag
  channel: 7
- name: land_flag
  channel: 8
target:
  name: CHL
  units: milligram m-3
preprocessing:
  expected_input_shape:
  - null
  - null
  - null
  - 9
  transforms:
    target: natural logarithm
    temporal_lags: 1
  standardization:
    masked_target:
      mean: 0.0
      std: 1.0
      applied: true
    masked_target_m1:
      mean: 0.0
      std: 1.0
      applied: true
    masked_target_p1:
      mean: 0.0
      std: 1.0
      applied: true
    day_sin:
      mean: 0.0
      std: 1.0
      applied: false
    day_cos:
      mean: 0.0
      std: 1.0
      applied: false
    synthetic_missing_flag:
      mean: 0.0
      std: 1.0
      applied: false
    true_missing_flag:
      mean: 0.0
      std: 1.0
      applied: false
    valid_masked_target_flag:
      mean: 0.0
      std: 1.0
      applied: false
    land_flag:
      mean: 0.0
      std: 1.0
      applied: false
    full_target:
      mean: 0.0
      std: 1.0
      applied: true
  missing_value_handling: Missing predictor values are replaced with zero after standardization;
    mask channels identify land and missing data.
limitations: Validated only for the documented product, region, training period, channel
  order, and preprocessing configuration.
source:
  repository: https://github.com/SAFS-Varanasi-Internship/mindthegap
  git_commit: df8d95c1ac84fc98b6e3368b671c04d2b578949e
